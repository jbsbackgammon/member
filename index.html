<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">
  <title>会員情報</title>
  <link rel="stylesheet" href="./style.css?v=9">
</head>
<body>
  <header class="app-header">
    <h1>会員情報</h1>
    <div class="header-actions">
      <input id="searchInput" class="header-search" type="search" autocomplete="off" placeholder="検索" aria-label="検索">
      <button id="printBtn" class="button" type="button" disabled>名札出力 <span id="selectedCount">0</span>名</button>
    </div>
  </header>

  <main class="app-main">
    <section class="member-list-wrap">
      <div class="member-list-head" aria-hidden="true">
        <div class="col-name">名前</div>
        <div class="col-en">名前英語</div>
        <div class="col-photo">顔写真</div>
        <div class="col-check">名札</div>
        <div class="col-badge">名札文言</div>
        <div class="col-color">名札帯色</div>
      </div>
      <div id="memberList" class="member-list"></div>
      <div id="emptyState" class="empty-state" hidden>
        <strong id="emptyTitle">会員情報がありません。</strong>
        <span id="emptyMessage">images/ に「名前_名前英語.png」形式で顔写真を保存してください。</span>
      </div>
    </section>
  </main>

  <template id="memberRowTemplate">
    <article class="member-row">
      <div class="col-name text-cell">
        <div class="member-name-ja"></div>
      </div>
      <div class="col-en text-cell">
        <div class="member-name-en"></div>
      </div>
      <div class="col-photo photo-cell">
        <div class="photo-wrap">
          <img class="member-photo" alt="顔写真" hidden>
          <div class="photo-placeholder">PHOTO</div>
        </div>
      </div>
      <div class="col-check field-check">
        <label class="print-check-label" title="名札出力対象にする">
          <input class="print-check" type="checkbox" aria-label="名札出力対象">
        </label>
      </div>
      <div class="col-badge field-cell">
        <input class="badge-text" type="text" autocomplete="off" aria-label="名札文言">
      </div>
      <div class="col-color color-cell">
        <div class="color-presets" aria-label="名札帯色">
          <button type="button" data-color="" class="color-none" title="色なし" aria-label="色なし"></button>
          <button type="button" data-color="#fff200" title="黄" aria-label="黄"></button>
          <button type="button" data-color="#b42893" title="紫" aria-label="紫"></button>
          <button type="button" data-color="#000000" title="黒" aria-label="黒"></button>
          <button type="button" data-color="#1b5fbf" title="青" aria-label="青"></button>
        </div>
      </div>
    </article>
  </template>

  <div id="printRoot" class="print-root" aria-hidden="true"></div>

  <script type="module" src="./src/app.js?v=9"></script>
</body>
</html>
