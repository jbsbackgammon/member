<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">
  <title>会員情報</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>会員情報</h1>
      <p>氏名・英語名・顔写真・名札情報を管理</p>
    </div>
    <div class="header-actions">
      <button id="addMemberBtn" class="button primary" type="button">＋ 会員追加</button>
      <button id="printBtn" class="button" type="button" disabled>名札PDF出力 <span id="selectedCount">0</span>名</button>
    </div>
  </header>

  <main class="app-main">
    <section class="toolbar" aria-label="会員リスト操作">
      <label class="search-box">
        <span>検索</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="名前・英語名・名札文言">
      </label>
      <div class="toolbar-spacer"></div>
      <button id="selectVisibleBtn" class="button small" type="button">表示中を全選択</button>
      <button id="exportBtn" class="button small" type="button">JSONバックアップ</button>
      <label class="button small file-button">
        JSON読込
        <input id="importInput" type="file" accept="application/json,.json" hidden>
      </label>
    </section>

    <div class="storage-note">
      データと顔写真はこのブラウザ内に保存されます。共有端末や別ブラウザへ移す場合は「JSONバックアップ」を利用してください。
    </div>

    <section class="member-list-wrap">
      <div class="member-list-head" aria-hidden="true">
        <div class="col-check">出力</div>
        <div class="col-photo">顔写真</div>
        <div class="col-name">名前</div>
        <div class="col-en">名前英語</div>
        <div class="col-badge">名札文言</div>
        <div class="col-color">帯色</div>
        <div class="col-actions">操作</div>
      </div>
      <div id="memberList" class="member-list"></div>
      <div id="emptyState" class="empty-state" hidden>
        <strong>会員が登録されていません。</strong>
        <span>「会員追加」から登録してください。</span>
      </div>
    </section>
  </main>

  <template id="memberRowTemplate">
    <article class="member-row">
      <div class="col-check field-check">
        <label class="print-check-label" title="名札出力対象にする">
          <input class="print-check" type="checkbox">
          <span>名札</span>
        </label>
      </div>
      <div class="col-photo photo-cell">
        <div class="main-photo-wrap">
          <img class="main-photo" alt="メイン顔写真" hidden>
          <div class="photo-placeholder">PHOTO</div>
        </div>
        <div class="photo-actions">
          <label class="button tiny file-button">画像追加<input class="photo-input" type="file" accept="image/*" multiple hidden></label>
          <span class="photo-count">0枚</span>
        </div>
        <div class="photo-strip" aria-label="登録画像"></div>
      </div>
      <div class="col-name field-cell">
        <label>名前<input class="name-ja" type="text" autocomplete="off" placeholder="柳 暢祐"></label>
      </div>
      <div class="col-en field-cell">
        <label>名前英語<input class="name-en" type="text" autocomplete="off" placeholder="YANAGI Nobusuke"></label>
      </div>
      <div class="col-badge field-cell">
        <label>名札文言<input class="badge-text" type="text" autocomplete="off" placeholder="大会スタッフ"></label>
      </div>
      <div class="col-color color-cell">
        <div class="color-row">
          <button class="color-none" type="button">帯なし</button>
          <label class="custom-color-label" title="任意の帯色">
            <span>任意</span><input class="band-color" type="color" value="#000000">
          </label>
        </div>
        <div class="color-presets" aria-label="帯色プリセット">
          <button type="button" data-color="#fff200" title="黄"></button>
          <button type="button" data-color="#b42893" title="紫"></button>
          <button type="button" data-color="#000000" title="黒"></button>
        </div>
      </div>
      <div class="col-actions row-actions">
        <button class="delete-member danger-link" type="button">削除</button>
      </div>
    </article>
  </template>

  <div id="printRoot" class="print-root" aria-hidden="true"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
