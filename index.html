<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">
  <title>選手素材管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;800&display=swap" rel="stylesheet" media="screen">
  <link rel="stylesheet" href="https://jbsbackgammon.github.io/common/ui.css" media="screen">
  <link rel="stylesheet" href="./style.css?v=32">
  <link rel="icon" href="https://jbsbackgammon.github.io/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="https://jbsbackgammon.github.io/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://jbsbackgammon.github.io/apple-touch-icon.png">
</head>
<body class="jbsui">
  <header class="app-header jbsui-panel">
    <div class="header-actions jbsui-actions">
      <button id="photoExportBtn" class="button button-primary jbsui-button jbsui-button--primary jbsui-button--primary-action" type="button" disabled>写真出力</button>
      <button id="printBtn" class="button button-primary jbsui-button jbsui-button--primary jbsui-button--primary-action" type="button" disabled>名札出力</button>
      <div id="selectionCount" class="selection-count" aria-live="polite">選択0名</div>
      <div class="header-search-field jbsui-field"><input id="searchInput" class="header-search" type="search" autocomplete="off" placeholder="検索" aria-label="検索"></div>
      <button id="inputSelectBtn" class="button jbsui-button" type="button" disabled>リスト選択</button>
      <button id="selectAllBtn" class="button jbsui-button" type="button" disabled>全選択</button>
      <button id="clearAllBtn" class="button jbsui-button" type="button" disabled>全解除</button>
      <button id="jsonImportBtn" class="button jbsui-button" type="button" disabled>JSON取込</button>
      <button id="jsonExportBtn" class="button jbsui-button" type="button" disabled>JSON出力</button>
      <input id="jsonImportInput" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="app-main">
    <section class="member-list-wrap jbsui-reference-scroll">
      <table class="member-table jbsui-reference-table" aria-label="選手一覧">
        <colgroup>
          <col class="col-check">
          <col class="col-photo">
          <col class="col-name">
          <col class="col-en">
          <col class="col-badge">
          <col class="col-color">
        </colgroup>
        <thead>
          <tr class="member-list-head">
            <th scope="col" class="col-check">選択</th>
            <th scope="col" class="col-photo">写真</th>
            <th scope="col" class="col-name">名前</th>
            <th scope="col" class="col-en">名前英語</th>
            <th scope="col" class="col-badge">名札文言</th>
            <th scope="col" class="col-color">名札帯色</th>
          </tr>
        </thead>
        <tbody id="memberList" class="member-list"></tbody>
      </table>
      <div id="emptyState" class="empty-state" hidden>
        <strong id="emptyTitle">会員情報がありません。</strong>
        <span id="emptyMessage">images/ に「名前_名前英語.png」形式で顔写真を保存してください。</span>
      </div>
    </section>
  </main>

  <dialog id="inputSelectDialog" class="input-select-dialog jbsui-dialog">
    <form method="dialog" class="input-select-modal" id="inputSelectForm">
      <div class="input-select-modal-head jbsui-dialog-head">
        <h2>リスト選択</h2>
        <button id="inputSelectCloseBtn" class="modal-close jbsui-dialog-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="input-select-modal-body">
        <textarea id="inputSelectText" rows="14" placeholder="西川 清一/NISHIKAWA Kiyokazu&#10;中村 順子/NAKAMURA Junko" aria-label="選手リスト"></textarea>
        <div id="inputSelectResult" class="input-select-result" hidden></div>
      </div>
      <div class="input-select-modal-actions jbsui-actions">
        <button id="inputSelectCancelBtn" class="button jbsui-button" type="button">キャンセル</button>
        <button id="inputSelectApplyBtn" class="button button-primary jbsui-button jbsui-button--primary" type="button">選択</button>
      </div>
    </form>
  </dialog>

  <template id="memberRowTemplate">
    <tr class="member-row">
      <td class="col-check field-check">
        <label class="print-check-label jbsui-check" title="選択">
          <input class="print-check" type="checkbox" aria-label="選択">
        </label>
      </td>
      <td class="col-photo photo-cell">
        <div class="photo-wrap">
          <img class="member-photo" alt="顔写真" hidden>
          <div class="photo-placeholder">PHOTO</div>
        </div>
      </td>
      <td class="col-name text-cell">
        <div class="member-name-ja"></div>
      </td>
      <td class="col-en text-cell">
        <div class="member-name-en"></div>
      </td>
      <td class="col-badge field-cell">
        <div class="jbsui-field"><input class="badge-text" type="text" autocomplete="off" aria-label="名札文言"></div>
      </td>
      <td class="col-color color-cell">
        <div class="color-presets" aria-label="名札帯色">
          <button type="button" data-color="" class="color-none" title="色なし" aria-label="色なし"></button>
          <button type="button" data-color="#000000" title="黒" aria-label="黒"></button>
          <button type="button" data-color="#d32f2f" title="赤" aria-label="赤"></button>
          <button type="button" data-color="#1b5fbf" title="青" aria-label="青"></button>
          <button type="button" data-color="#fff200" title="黄" aria-label="黄"></button>
          <button type="button" data-color="#2e7d32" title="緑" aria-label="緑"></button>
          <button type="button" data-color="#ef6c00" title="橙" aria-label="橙"></button>
          <button type="button" data-color="#e91e63" title="桃" aria-label="桃"></button>
          <button type="button" data-color="#8e24aa" title="紫" aria-label="紫"></button>
        </div>
      </td>
    </tr>
  </template>

  <div id="printRoot" class="print-root" aria-hidden="true"></div>

  <script type="module" src="./src/app.js?v=32"></script>
</body>
</html>
