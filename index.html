<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#ffffff">
  <title>選手素材</title>
  <link rel="stylesheet" href="./style.css?v=23">
</head>
<body>
  <header class="app-header">
    <div class="header-actions">
      <input id="searchInput" class="header-search" type="search" autocomplete="off" placeholder="検索" aria-label="検索">
      <button id="inputSelectBtn" class="button" type="button" disabled>入力選択</button>
      <button id="selectAllBtn" class="button" type="button" disabled>全選択</button>
      <button id="clearAllBtn" class="button" type="button" disabled>全解除</button>
      <button id="photoExportBtn" class="button button-primary" type="button" disabled>写真出力</button>
      <button id="printBtn" class="button button-primary" type="button" disabled>名札出力</button>
    </div>
  </header>

  <main class="app-main">
    <section class="member-list-wrap">
      <div class="member-list-head" aria-hidden="true">
        <div class="col-check">選択</div>
        <div class="col-photo">顔写真</div>
        <div class="col-name">名前</div>
        <div class="col-en">名前英語</div>
        <div class="col-badge">名札文言</div>
        <div class="col-color">名札帯色</div>
      </div>
      <div id="memberList" class="member-list"></div>
      <div id="emptyState" class="empty-state" hidden>
        <strong id="emptyTitle">会員情報がありません。</strong>
        <span id="emptyMessage">images/ に「名前_名前英語.png」形式で顔写真を保存してください。</span>
      </div>
    </section>
  </main>

  <dialog id="inputSelectDialog" class="input-select-dialog">
    <form method="dialog" class="input-select-modal" id="inputSelectForm">
      <div class="input-select-modal-head">
        <strong>入力選択</strong>
        <button id="inputSelectCloseBtn" class="modal-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div class="input-select-modal-body">
        <textarea id="inputSelectText" rows="14" placeholder="西川 清一/NISHIKAWA Kiyokazu&#10;中村 順子/NAKAMURA Junko" aria-label="選手リスト"></textarea>
        <div id="inputSelectResult" class="input-select-result" hidden></div>
      </div>
      <div class="input-select-modal-actions">
        <button id="inputSelectCancelBtn" class="button" type="button">キャンセル</button>
        <button id="inputSelectApplyBtn" class="button button-primary" type="button">選択</button>
      </div>
    </form>
  </dialog>

  <template id="memberRowTemplate">
    <article class="member-row">
      <div class="col-check field-check">
        <label class="print-check-label" title="選択">
          <input class="print-check" type="checkbox" aria-label="選択">
        </label>
      </div>
      <div class="col-photo photo-cell">
        <div class="photo-wrap">
          <img class="member-photo" alt="顔写真" hidden>
          <div class="photo-placeholder">PHOTO</div>
        </div>
      </div>
      <div class="col-name text-cell">
        <div class="member-name-ja"></div>
      </div>
      <div class="col-en text-cell">
        <div class="member-name-en"></div>
      </div>
      <div class="col-badge field-cell">
        <input class="badge-text" type="text" autocomplete="off" aria-label="名札文言">
      </div>
      <div class="col-color color-cell">
        <div class="color-presets" aria-label="名札帯色">
          <button type="button" data-color="" class="color-none" title="色なし" aria-label="色なし"></button>
          <button type="button" data-color="#000000" title="黒" aria-label="黒"></button>
          <button type="button" data-color="#d32f2f" title="赤" aria-label="赤"></button>
          <button type="button" data-color="#1b5fbf" title="青" aria-label="青"></button>
          <button type="button" data-color="#fff200" title="黄" aria-label="黄"></button>
          <button type="button" data-color="#2e7d32" title="緑" aria-label="緑"></button>
          <button type="button" data-color="#ef6c00" title="橙" aria-label="橙"></button>
          <button type="button" data-color="#e91e63" title="桃" aria-label="桃"></button>
          <button type="button" data-color="#8e24aa" title="紫" aria-label="紫"></button>
        </div>
      </div>
    </article>
  </template>

  <div id="printRoot" class="print-root" aria-hidden="true"></div>

  <script type="module" src="./src/app.js?v=20"></script>
</body>
</html>
